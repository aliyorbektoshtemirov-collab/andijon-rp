name: andijon_rp
description: "Andijon RP — Flutter WebView o'rami (o'yin: assets/game/index.html)"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.7.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/game/index.html

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
