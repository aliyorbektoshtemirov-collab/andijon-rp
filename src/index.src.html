<script>// Cloudflare Worker manzilini yozing: "wss://andijon-rp.ISM.workers.dev"
const SERVER="wss://andijon-rp.eco-school.workers.dev";
const DISTRICTS=["Andijon","Asaka","Shahrixon","Marhamat","Xo'jaobod","Paxtaobod","Qo'rg'ontepa","Baliqchi","Bo'z","Oltinko'l","Izboskan"];
const $=id=>document.getElementById(id);
let LS={};try{LS=JSON.parse(localStorage.getItem("arp2")||"{}")}catch(e){}
DISTRICTS.forEach(d=>{const o=document.createElement("option");o.value=d;o.textContent=d+" tumani";$("ds").appendChild(o)});
$("nm").value=LS.name||"";if(LS.district)$("ds").value=LS.district;
const SV={name:"",district:"",money:0,hunger:100,fuel:0,cars:[],role:"fuqaro"};
$("go").onclick=()=>{if(!SERVER)return $("er").textContent="index.html ichida SERVER manzili yozilmagan";
 SV.name=$("nm").value.trim();SV.district=$("ds").value;if(SV.name.length<3||$("pw").value.length<4)return $("er").textContent="Ism 3+, parol 4+ belgi bo'lsin";
 try{localStorage.setItem("arp2",JSON.stringify({name:SV.name,district:SV.district}))}catch(e){}
 UI.begin();start($("pw").value)};
const ROLE={fuqaro:"fuqaro",polis:"politsiyachi",shifokor:"shifokor",owner:"OWNER"};
// ===== 3D MASHINA MODELLARI (tools/build_models.py -> src/models.json, build_index.py shu yerga joylaydi) =====
const CARDATA=/*@@MODELS@@*/{};
const CAR_YAW=Math.PI/2; // model old tomoni +Z -> o'yin old tomoni +X. Mashina teskari ketsa: -Math.PI/2
const NPCK=["sedan","taxi","police","delivery","suv","truck"]; // shahar yo'lidagi NPC mashinalar
const CG={},CMAT=new THREE.MeshLambertMaterial({vertexColors:true});
function b64u(s,T){const b=atob(s),n=b.length,u=new Uint8Array(n);for(let i=0;i<n;i++)u[i]=b.charCodeAt(i);return T===Uint8Array?u:new T(u.buffer)}
function glbGeo(d){const g=new THREE.BufferGeometry();
 g.setAttribute("position",new THREE.BufferAttribute(b64u(d.v,Float32Array),3));
 g.setAttribute("normal",new THREE.BufferAttribute(b64u(d.n,Int8Array),3,true));
 g.setAttribute("color",new THREE.BufferAttribute(b64u(d.c,Uint8Array),3,true));
 g.setIndex(new THREE.BufferAttribute(b64u(d.i,Uint16Array),1));return g}
// key modeli L uzunlikka keltirilgan Group qaytaradi (model topilmasa null -> eski quti-mashina ishlatiladi)
function mkGLB(key,L){const d=CARDATA[key];if(!d)return null;
 if(!CG[key])CG[key]=d.p.map(p=>({g:glbGeo(p),o:p.o,w:p.w}));
 const g=new THREE.Group(),m=new THREE.Group();
 CG[key].forEach(p=>{const me=new THREE.Mesh(p.g,CMAT);if(p.o)me.position.set(p.o[0],p.o[1],p.o[2]);if(p.w)me.userData.wheel=1;m.add(me)});
 const k=L/d.L;m.scale.set(k,k,k);m.rotation.y=CAR_YAW;g.add(m);return g}
// ===== SHAHARLAR (Vatikan + ortogonal shahar). tools/build_city.py -> src/cities.json =====
const CITYDATA=/*@@CITIES@@*/{};
// markaz koordinatalari. Yadro shahar (400x400) markazda; Vatikan shimolda (z<0), ortogonal shahar janubda (z>0)
const CITIES=[{k:"vatican",x:0,z:-502},{k:"ciudad",x:0,z:431}];
const CITY_COLLIDE=false; // true = shahar binolariga to'qnashuv (sinab ko'rilmagan, ko'cha kataklari xato bloklanishi mumkin)
const WORLD=[[-198,198,-198,198]]; // ruxsat etilgan maydonlar [x0,x1,z0,z1]; shaharlar qo'shilganda kengayadi
const CGRIDS=[];
const inWorld=(x,z)=>WORLD.some(r=>x>=r[0]&&x<=r[1]&&z>=r[2]&&z<=r[3]);
function cityHit(x,z){if(!CITY_COLLIDE)return false;for(const c of CGRIDS){const i=Math.floor((x-c.ox-c.x0)/c.cell),j=Math.floor((z-c.oz-c.z0)/c.cell);
 if(i>=0&&j>=0&&i<c.w&&j<c.h){const b=j*c.w+i;if(c.bits[b>>3]&(128>>(b&7)))return true}}return false}
function addCities(S){const CM=new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide});
 CITIES.forEach(c=>{const d=CITYDATA[c.k];if(!d)return;
  const a=b64u(d.v,Int16Array),pos=new Float32Array(a.length);for(let i=0;i<a.length;i++)pos[i]=a[i]*d.q;
